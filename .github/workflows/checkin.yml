name: AnyRouter 自动签到

# 纯 GitHub Actions 定时签到
# 关键点：
#  1. cron 全部错开整点（GitHub 整点调度高峰最容易丢 run）
#  2. concurrency 防止重叠执行
#  3. 每次成功后在仓库留下提交（keepalive），避免仓库长期无活动导致 schedule 被限制
on:
  schedule:
    - cron: '17 0 * * *'    # 北京 08:17
    - cron: '23 4 * * *'    # 北京 12:23
    - cron: '47 12 * * *'   # 北京 20:47
  workflow_dispatch:

concurrency:
  group: autocheck-anyrouter
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      # 仓库可见性，用于隐私控制
      REPO_VISIBILITY: ${{ github.event.repository.visibility }}
      # 时区设置（可选，默认为 Asia/Shanghai 中国时区）
      TZ: ${{ secrets.TZ }}
      # 时间戳格式（可选，默认为 %Y-%m-%d %H:%M:%S）
      TIMESTAMP_FORMAT: ${{ secrets.TIMESTAMP_FORMAT }}
      # 账号配置
      ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
      # 是否显示敏感信息
      SHOW_SENSITIVE_INFO: ${{ secrets.SHOW_SENSITIVE_INFO }}
      # 通知配置
      DINGTALK_NOTIF_CONFIG: ${{ secrets.DINGTALK_NOTIF_CONFIG }}
      EMAIL_NOTIF_CONFIG: ${{ secrets.EMAIL_NOTIF_CONFIG }}
      PUSHPLUS_NOTIF_CONFIG: ${{ secrets.PUSHPLUS_NOTIF_CONFIG }}
      SERVERPUSH_NOTIF_CONFIG: ${{ secrets.SERVERPUSH_NOTIF_CONFIG }}
      FEISHU_NOTIF_CONFIG: ${{ secrets.FEISHU_NOTIF_CONFIG }}
      WECOM_NOTIF_CONFIG: ${{ secrets.WECOM_NOTIF_CONFIG }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v5

      - name: 🔑 加载账号配置
        uses: oNaiPs/secrets-to-env-action@v1.8
        with:
          secrets: ${{ toJSON(secrets) }}
          include: ANYROUTER_ACCOUNT_*

      - name: 🔧 安装 Mise
        # 临时固定到已切换为 Node.js 24 的 commit，待上游发布正式 tag 后再回切。
        uses: jdx/mise-action@a0eaf7aa03d8c15f7e32f71429266c3d5d3cb442
        with:
          cache_key: "{{default}}-${{ hashFiles('pyproject.toml') }}"

      - name: ⚙️ 安装依赖
        run: mise run install

      - name: 🎭 配置 Playwright 环境
        uses: ./.github/actions/setup-playwright
        id: playwright-setup

      - name: 💾 恢复余额历史缓存
        uses: actions/cache@v5
        with:
          path: balance_hash.txt
          key: balance-hash-${{ github.run_id }}
          restore-keys: |
            balance-hash-

      - name: 🚀 执行签到任务
        run: mise run checkin

      # 让仓库保持“有活动”，防止长期只有 schedule 读取、没有提交，
      # 被 GitHub 判定为不活跃仓库而把 scheduled workflow 打入 action_required。
      - name: 🫀 保活提交（每天最多一次）
        if: always()
        run: |
          set -e
          today=$(date -u +%F)
          if [ -f .last-checkin ] && grep -q "$today" .last-checkin; then
            echo "今天已经提交过心跳，跳过"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$today $(date -u +%H:%M:%SZ)" > .last-checkin
          git add .last-checkin
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: checkin heartbeat $(date -u +%F)"
            git push
          fi
