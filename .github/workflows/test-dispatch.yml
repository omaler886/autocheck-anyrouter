name: test-dispatch
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: try trigger checkin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run checkin.yml --repo "${{ github.repository }}" --ref main
          echo "dispatch exit=$?"
