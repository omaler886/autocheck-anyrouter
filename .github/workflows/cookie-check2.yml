name: cookie-check2

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v5

      - name: 🔧 安装 Mise
        uses: jdx/mise-action@a0eaf7aa03d8c15f7e32f71429266c3d5d3cb442
        with:
          cache_key: "{{default}}-${{ hashFiles('pyproject.toml') }}"

      - name: ⚙️ 安装依赖
        run: mise run install

      - name: 🎭 配置 Playwright 环境
        uses: ./.github/actions/setup-playwright
        id: playwright-setup

      - name: 🍪 读取 cookie 实际过期时间
        run: |
          python3 - <<'PY'
          import os, json, asyncio, datetime
          from playwright.async_api import async_playwright

          async def main():
              raw = os.environ.get('ANYROUTER_ACCOUNTS', '')
              data = json.loads(raw)
              if isinstance(data, dict):
                  data = [data]

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=['--disable-blink-features=AutomationControlled', '--no-sandbox'],
                  )
                  for acc in data:
                      name = acc.get('name') or acc.get('api_user') or 'unknown'
                      cookies = acc.get('cookies')
                      if isinstance(cookies, str):
                          cookies = {k.strip(): v for k, v in (part.split('=', 1) for part in cookies.split(';') if '=' in part)}
                      if not isinstance(cookies, dict):
                          print(f'[{name}] invalid cookies type')
                          continue

                      ctx = await browser.new_context()
                      jar = [{'name': k, 'value': v, 'domain': '.anyrouter.top', 'path': '/'} for k, v in cookies.items()]
                      await ctx.add_cookies(jar)
                      page = await ctx.new_page()
                      try:
                          resp = await page.goto('https://anyrouter.top/console', wait_until='domcontentloaded', timeout=60000)
                          print(f'[{name}] http={resp.status if resp else None} url={page.url}')
                          print(f'[{name}] title={await page.title()}')
                      except Exception as e:
                          print(f'[{name}] goto_error={type(e).__name__}: {str(e)[:120]}')

                      try:
                          all_cookies = await ctx.cookies()
                          now = datetime.datetime.now(datetime.timezone.utc)
                          for c in all_cookies:
                              exp = c.get('expires')
                              if isinstance(exp, (int, float)) and exp > 0:
                                  dt = datetime.datetime.fromtimestamp(exp, datetime.timezone.utc)
                                  left = dt - now
                                  print(f"  [{name}] cookie={c['name']} domain={c.get('domain')} expires={dt.strftime('%Y-%m-%d %H:%M:%S')} UTC left={round(left.total_seconds()/3600,2)}h")
                              else:
                                  print(f"  [{name}] cookie={c['name']} domain={c.get('domain')} expires=session-only")
                      except Exception as e:
                          print(f'[{name}] cookie_read_error={e}')

                      await ctx.close()
                  await browser.close()

          asyncio.run(main())
          PY
